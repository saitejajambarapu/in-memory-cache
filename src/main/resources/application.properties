spring.application.name=cache
spring.datasource.url=jdbc:mysql://localhost:3306/inmemeorycache
spring.datasource.username=root
spring.datasource.password=sai2714@sql

# ======================
# JPA / Hibernate
# ======================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Show SQL queries
spring.jpa.show-sql=true

# Show SQL parameters/values (Hibernate 6 / Spring Boot 3)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Show SQL result/execution-related JDBC logs
logging.level.org.hibernate.SQL=DEBUG